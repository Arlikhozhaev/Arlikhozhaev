<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle top accent -->
    <linearGradient id="accent" x1="40" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>

    <!-- Very subtle background glow -->
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#1E293B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0A0E17" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle dot grid -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.8" fill="#94A3B8" opacity="0.045"/>
    </pattern>

    <clipPath id="terminalClip">
      <rect x="40" y="30" width="1120" height="320" rx="16"/>
    </clipPath>

    <!-- Soft shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="#080C13"/>
  <rect width="1200" height="380" fill="url(#glow)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>

  <!-- Terminal -->
  <g filter="url(#shadow)" clip-path="url(#terminalClip)">

    <!-- Terminal body -->
    <rect x="40" y="30" width="1120" height="320" fill="#0C111A"/>

    <!-- Window header -->
    <rect x="40" y="30" width="1120" height="42" fill="#101722"/>

    <!-- Accent hairline -->
    <rect x="40" y="30" width="1120" height="2" fill="url(#accent)"/>

    <!-- macOS window controls -->
    <circle cx="65" cy="51" r="5.5" fill="#FF5F57"/>
    <circle cx="84" cy="51" r="5.5" fill="#FEBC2E"/>
    <circle cx="103" cy="51" r="5.5" fill="#28C840"/>

    <!-- Terminal title -->
    <text
      x="600"
      y="55"
      text-anchor="middle"
      font-family="SF Pro Display, Segoe UI, Arial, sans-serif"
      font-size="12"
      fill="#64748B"
      letter-spacing="0.2"
    >
      abdu_alim — software engineer
    </text>

    <!-- Terminal path -->
    <text
      x="78"
      y="94"
      font-family="SF Mono, Cascadia Code, Consolas, monospace"
      font-size="13"
      fill="#64748B"
    >
      ~/engineering/profile
    </text>

    <!-- Main code -->
    <g
      font-family="SF Mono, Cascadia Code, Consolas, Roboto Mono, monospace"
      font-size="18"
    >

      <!-- Line numbers -->
      <g
        font-size="13"
        fill="#334155"
        text-anchor="end"
      >
        <text x="92" y="123">01</text>
        <text x="92" y="149">02</text>
        <text x="92" y="175">03</text>
        <text x="92" y="201">04</text>
        <text x="92" y="227">05</text>
        <text x="92" y="253">06</text>
        <text x="92" y="279">07</text>
        <text x="92" y="305">08</text>
      </g>

      <!-- Vertical editor line -->
      <line
        x1="108"
        y1="108"
        x2="108"
        y2="318"
        stroke="#1E293B"
        stroke-width="1"
      />

      <!-- Line 1 -->
      <text x="128" y="123">
        <tspan fill="#C084FC">const</tspan>
        <tspan fill="#E2E8F0"> engineer </tspan>
        <tspan fill="#64748B">=</tspan>
        <tspan fill="#E2E8F0"> {</tspan>
      </text>

      <!-- Line 2 -->
      <text x="148" y="149">
        <tspan fill="#7DD3FC">name:</tspan>
        <tspan fill="#E2E8F0"> </tspan>
        <tspan fill="#FBBF75">"Abdu Alim Arlikhozhaev"</tspan>
        <tspan fill="#64748B">,</tspan>
      </text>

      <!-- Line 3 -->
      <text x="148" y="175">
        <tspan fill="#7DD3FC">role:</tspan>
        <tspan fill="#E2E8F0"> </tspan>
        <tspan fill="#FBBF75">"Software Engineer"</tspan>
        <tspan fill="#64748B">,</tspan>
      </text>

      <!-- Line 4 -->
      <text x="148" y="201">
        <tspan fill="#7DD3FC">building:</tspan>
        <tspan fill="#E2E8F0"> </tspan>
        <tspan fill="#FBBF75">"AI-powered, scalable full-stack systems"</tspan>
        <tspan fill="#64748B">,</tspan>
      </text>

      <!-- Line 5 -->
      <text x="148" y="227">
        <tspan fill="#7DD3FC">stack:</tspan>
        <tspan fill="#64748B"> [</tspan>
      </text>

      <!-- Line 6 -->
      <text x="168" y="253">
        <tspan fill="#FBBF75">"TypeScript"</tspan>
        <tspan fill="#64748B">, </tspan>
        <tspan fill="#FBBF75">"Python"</tspan>
        <tspan fill="#64748B">, </tspan>
        <tspan fill="#FBBF75">"Java"</tspan>
        <tspan fill="#64748B">, </tspan>
        <tspan fill="#FBBF75">"C++"</tspan>
        <tspan fill="#64748B">, </tspan>
        <tspan fill="#FBBF75">"Next.js"</tspan>
        <tspan fill="#64748B">, </tspan>
      </text>

      <!-- Line 7 -->
      <text x="168" y="279">
        <tspan fill="#FBBF75">"Node.js"</tspan>
        <tspan fill="#64748B">,</tspan>
        <tspan fill="#FBBF75">"PostgreSQL"</tspan>
        <tspan fill="#64748B">, </tspan>
        <tspan fill="#FBBF75">"AWS"</tspan>
        <tspan fill="#64748B">, </tspan>
        <tspan fill="#FBBF75">"Terraform"</tspan>
      </text>

      <!-- Line 8 -->
      <text x="148" y="305">
        <tspan fill="#64748B">],</tspan>
        <tspan fill="#7DD3FC"> currently:</tspan>
        <tspan fill="#FBBF75"> "building • contributing • learning"</tspan>
      </text>

      <!-- Closing brace -->
      <text x="128" y="331" fill="#64748B">};</text>

    </g>

    <!-- Cursor -->
    <rect x="535" y="316" width="2" height="19" fill="#60A5FA">
      <animate
        attributeName="opacity"
        values="1;1;0;0;1"
        keyTimes="0;0.45;0.5;0.95;1"
        dur="1.15s"
        repeatCount="indefinite"
      />
    </rect>

  </g>

  <!-- Crisp terminal border -->
  <rect
    x="40"
    y="30"
    width="1120"
    height="320"
    rx="16"
    fill="none"
    stroke="#1E293B"
    stroke-width="1.5"
  />

  <!-- Bottom metadata -->
  <text
    x="600"
    y="370"
    text-anchor="middle"
    font-family="SF Mono, Cascadia Code, Consolas, monospace"
    font-size="10"
    fill="#334155"
    letter-spacing="1.5"
  >
    SOFTWARE • AI • CLOUD • OPEN SOURCE
  </text>

</svg>
