<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" xml:space="preserve">
  <defs>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3178c6"/>
      <stop offset="50%" stop-color="#68a063"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="40" y="30" width="1120" height="320" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="380" fill="#0a0e17"/>
  <rect width="1200" height="380" fill="url(#dots)"/>
  <rect width="1200" height="380" fill="url(#vignette)"/>

  <!-- card -->
  <g clip-path="url(#cardClip)">
    <rect x="40" y="30" width="1120" height="320" fill="#0d1420"/>
    <rect x="40" y="30" width="1120" height="34" fill="#10161f"/>
    <rect x="40" y="30" width="1120" height="3" fill="url(#hairline)"/>

    <circle cx="62" cy="47" r="6" fill="#ff5f56"/>
    <circle cx="82" cy="47" r="6" fill="#ffbd2e"/>
    <circle cx="102" cy="47" r="6" fill="#27c93f"/>
    <text x="140" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#6b7685">abdu_alim: ~$</text>

    <line x1="104" y1="76" x2="104" y2="334" stroke="#1c2531" stroke-width="1"/>

    <g font-family="'SF Mono','Cascadia Code',Consolas,'Roboto Mono',monospace" font-size="19">
      <text x="96" y="92" text-anchor="end" fill="#3a4453" font-size="14">1</text>
      <text x="96" y="115" text-anchor="end" fill="#3a4453" font-size="14">2</text>
      <text x="96" y="138" text-anchor="end" fill="#3a4453" font-size="14">3</text>
      <text x="96" y="161" text-anchor="end" fill="#3a4453" font-size="14">4</text>
      <text x="96" y="184" text-anchor="end" fill="#3a4453" font-size="14">5</text>
      <text x="96" y="207" text-anchor="end" fill="#3a4453" font-size="14">6</text>
      <text x="96" y="230" text-anchor="end" fill="#3a4453" font-size="14">7</text>
      <text x="96" y="253" text-anchor="end" fill="#3a4453" font-size="14">8</text>
      <text x="96" y="276" text-anchor="end" fill="#3a4453" font-size="14">9</text>
      <text x="96" y="299" text-anchor="end" fill="#3a4453" font-size="14">10</text>
      <text x="96" y="322" text-anchor="end" fill="#3a4453" font-size="14">11</text>

      <!-- INDENT0 = 122 (top level: const / closing brace)  -->
      <!-- INDENT1 = 140 (object properties)                 -->
      <!-- INDENT2 = 158 (nested array items)                -->

      <text x="122" y="92"><tspan fill="#ff7b9c">const</tspan><tspan fill="#c9a7ff"> engineer</tspan><tspan fill="#4b5768"> = {</tspan></text>

      <text x="140" y="115"><tspan fill="#7dd3fc">name:</tspan><tspan fill="#4b5768">    </tspan><tspan fill="#ffb454">"Abdu Alim Arlikhozhaev"</tspan><tspan fill="#4b5768">,</tspan></text>
      <text x="140" y="138"><tspan fill="#7dd3fc">role:</tspan><tspan fill="#4b5768">    </tspan><tspan fill="#ffb454">"Software Engineer"</tspan><tspan fill="#4b5768">,</tspan></text>
      <text x="140" y="161"><tspan fill="#7dd3fc">focus:</tspan><tspan fill="#4b5768">   </tspan><tspan fill="#ffb454">"Scalable Full-Stack Applications"</tspan><tspan fill="#4b5768">,</tspan></text>
      <text x="140" y="184"><tspan fill="#7dd3fc">stack:</tspan><tspan fill="#4b5768"> [</tspan></text>

      <text x="158" y="207"><tspan fill="#ffb454">"TypeScript"</tspan><tspan fill="#4b5768">, </tspan><tspan fill="#ffb454">"JavaScript"</tspan><tspan fill="#4b5768">, </tspan><tspan fill="#ffb454">"Python"</tspan><tspan fill="#4b5768">, </tspan><tspan fill="#ffb454">"Java"</tspan><tspan fill="#4b5768">, </tspan><tspan fill="#ffb454">"C/C++"</tspan><tspan fill="#4b5768">,</tspan></text>
      <text x="158" y="230"><tspan fill="#ffb454">"Next.js"</tspan><tspan fill="#4b5768">, </tspan><tspan fill="#ffb454">"Node.js"</tspan><tspan fill="#4b5768">, </tspan><tspan fill="#ffb454">"PostgreSQL"</tspan><tspan fill="#4b5768">, </tspan><tspan fill="#ffb454">"AWS"</tspan></text>

      <text x="140" y="253"><tspan fill="#4b5768">],</tspan></text>
      <text x="140" y="276"><tspan fill="#7dd3fc">status:</tspan><tspan fill="#4b5768">  </tspan><tspan fill="#ffb454">"open_to_opportunities"</tspan><tspan fill="#4b5768">,</tspan></text>
      <text x="140" y="299"><tspan fill="#7dd3fc">hobbies:</tspan><tspan fill="#4b5768"> </tspan><tspan fill="#ffb454">"boxing, golfing, hiking, coding"</tspan></text>

      <text x="122" y="322"><tspan fill="#4b5768">};</tspan></text>

      <rect x="150" y="304" width="2" height="20" fill="#34d399">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- card border on top, unclipped, for crisp edges -->
  <rect x="40" y="30" width="1120" height="320" rx="14" ry="14" fill="none" stroke="#1c2531" stroke-width="1.5"/>
</svg>
